version: 2

models:
  - name: stg_customers
    description: "Cleaned and standardized customer data from the bronze layer."
    columns:
      - name: customer_id
        description: "Primary key for the customer."
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address in lowercase."
        tests:
          - not_null

  - name: fct_customer_summary
    description: "Aggregated customer metrics by country."
    columns:
      - name: country
        description: "The country name in uppercase."
        tests:
          - not_null
      - name: customer_count
        description: "Number of customers registered in this country."
